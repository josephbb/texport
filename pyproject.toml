[project]
name = "texport"
version = "0.1.0"
description = "Save figures, tables, and in-text numbers from an analysis so a LaTeX paper picks them up directly."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
authors = [{ name = "Joseph Bak-coleman" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: LaTeX",
]

[project.urls]
Homepage = "https://github.com/josephbb/texport"
Repository = "https://github.com/josephbb/texport"
Documentation = "https://joebakcoleman.com/texport/"
Issues = "https://github.com/josephbb/texport/issues"

[project.optional-dependencies]
figures = ["matplotlib"]
tables = ["pandas", "jinja2"]
all = ["matplotlib", "pandas", "jinja2"]

[dependency-groups]
dev = [
    "pytest",
    "matplotlib",
    "pandas",
    "jinja2",
    "hypothesis>=6.168.5",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "latex: compile generated LaTeX with pdflatex (skipped when unavailable)",
]
